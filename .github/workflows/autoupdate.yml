name: autoupdate

# GitHub Actions cannot subscribe to another repo's `release` events, so this
# polls upstream: every 6 hours, plus manual trigger.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bump manifest to latest stable release
        env:
          GITHUB_TOKEN: *** secrets.GITHUB_TOKEN }}
        run: python3 scripts/autoupdate.py

      - name: Commit and push if changed
        run: |
          if git diff --quiet bucket/; then
            echo "manifest already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          version=$(python3 -c "import json;print(json.load(open('bucket/sing-box-reF1nd.json'))['version'])")
          git add bucket/
          git commit -m "sing-box-reF1nd: update to ${version} [skip ci]"
          git push
